<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12213B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Siddhivinayak Enterprise</title>
<style>
:root{--bg:#F4F6F8;--ink:#12213B;--mut:#5A6578;--card:#fff;--line:#DCE1E8;--acc:#FFB400;--ok:#0E8A4F;--bad:#C9304B}
@media (prefers-color-scheme:dark){:root{--bg:#0C1424;--ink:#EDF1F7;--mut:#9AA6BA;--card:#131D31;--line:#243049;--ok:#3DCB8B;--bad:#FF7088}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:auto;padding:14px 14px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:800;font-size:1.15rem;line-height:1.1}.logo small{display:block;font-weight:500;color:var(--mut);font-size:.75rem}
button,input,select{font:inherit;color:var(--ink)}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
button{cursor:pointer}
.b{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.b.a{background:var(--acc);color:#12213B}.b.g{background:none;color:var(--ink);border:1px solid var(--line)}.b.s{padding:6px 10px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.mut{color:var(--mut);font-size:.9rem}
.seg{display:flex;gap:4px}.seg button{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-weight:600}
.seg .P.on{background:var(--ok);color:#fff;border-color:var(--ok)}.seg .H.on{background:var(--acc);color:#12213B;border-color:var(--acc)}.seg .A.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:1.5rem;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
h2{font-size:1.05rem;margin:0 0 6px}
#sl,#dg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px;z-index:9}
#sl[hidden],#dg[hidden]{display:none}#dg{z-index:20;align-items:center}#dgb{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;width:100%;max-width:380px}
#slb{background:#fff;color:#111;border-radius:14px;padding:18px;width:100%;max-width:440px}
#slb table{width:100%;border-collapse:collapse}#slb td{padding:6px 0;border-bottom:1px solid #ddd}#slb td:last-child{text-align:right}
@media print{.w,.noprint{display:none!important}#sl{position:static;background:none;padding:0}#slb{box-shadow:none;max-width:none}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.ch{text-align:center;font-size:.75rem;color:var(--mut);font-weight:600}
.cd{border:1px solid var(--line);border-radius:8px;min-height:46px;padding:3px 5px;display:flex;flex-direction:column;justify-content:space-between;font-size:.75rem}
.cd span{color:var(--mut)}.cd b{text-align:center;font-size:1rem}
.cd.P{background:var(--ok);border-color:var(--ok);color:#fff}.cd.H{background:var(--acc);border-color:var(--acc);color:#12213B}.cd.A{background:var(--bad);border-color:var(--bad);color:#fff}
.cd.P span,.cd.A span{color:#fff}.cd.H span{color:#12213B}
.lg{width:auto;padding:6px 8px;font-size:.85rem}
</style></head>
<body>
<div class="w" id="app"></div>
<div id="sl" hidden><div id="slb"></div></div>
<div id="dg" hidden><div id="dgb"></div></div>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body></html>
